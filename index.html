<!DOCTYPE html>
<html>
<head>
    <title>Welcome!</title>
    <meta charset='UTF-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='Styles/Mobile.css' media='(max-width: 767px)'>
    <link rel='stylesheet' href='Styles/Tablet.css' media='(min-width: 768px) and (max-width: 1023px)'>
    <link rel='stylesheet' href='Styles/Desktop.css' media='(min-width: 1024px)'>
    <link type='image/x-icon' rel='icon' href='Favicon.ico'>
    <script src='https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js'></script>
    <script src='https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js'></script>
    <link rel='manifest' href='Manifest.json'>
    <link rel='apple-touch-icon' href='Favicon.png'>
</head>
<body>

    <div id='login'>
        <input type='email' id='email' placeholder='email' size='30'><br>
        <input type='password' id='password' placeholder='password' size='30'><br>
        <button id='loginBtn'>Log in</button>
    </div>

    <div id='app'>
        <div id='availability'>
            <p></p>
            <button id='releaseBtn'>Release</button>
            <button id='punishBtn'>Punish</button>
        </div>
        <div id='punish'>
            <p>Specify punishment time (in minutes):</p>
            <input type='text' id = 'time'>
            <button id='okBtn'>Ok</button><br>
            <button id='cancelBtn'>Cancel</button>
        </div>
        <button id='refreshBtn'>Refresh</button><br>
        <button id='logoutBtn'>Log out</button>
        <div id='alarm'>
            The device must be taken now!
            <button id='pauseAudioBtn'>Ok</button>
        </div>
    </div>

    <script src='Script.js'></script>
</body>
</html>
